<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SILVER ZARIN FAKHR | Professional Silver Management</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --black:#030303;
  --obsidian:#080808;
  --panel:#101010;
  --panel2:#151515;
  --panel3:#1B1815;
  --silver:#C9C9C9;
  --silverBright:#F4F4F4;
  --gold:#B88A4A;
  --goldBright:#D4AF6A;
  --goldDark:#765328;
  --text:#E8E3DA;
  --muted:#938C82;
  --burgundy:#4A080C;
  --wine:#240603;
  --green:#00E676;
  --red:#FF1744;
  --blue:#4DA3FF;
  --borderGold:rgba(212,175,106,.30);
}
html{scroll-behavior:smooth}
body{
  font-family:Tahoma,Arial,sans-serif;
  min-height:100vh;
  background:
    radial-gradient(circle at 50% -15%,rgba(184,138,74,.13),transparent 34%),
    radial-gradient(circle at 90% 20%,rgba(74,8,12,.18),transparent 28%),
    linear-gradient(135deg,#020202,#0A0908 48%,#030303);
  color:var(--text);
}
button,input,select{font-family:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.container{width:min(1200px,94%);margin:auto}

/* LOGIN */
#loginPage{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:24px;
  background:
    radial-gradient(circle at 50% 35%,rgba(184,138,74,.09),transparent 30%),
    radial-gradient(circle at 80% 20%,rgba(74,8,12,.22),transparent 32%),
    linear-gradient(145deg,#020202,#0A0908,#030303);
}
.login-box{
  width:min(430px,100%);
  padding:38px 30px 30px;
  position:relative;
  background:linear-gradient(145deg,rgba(22,22,22,.97),rgba(7,7,7,.98));
  border:1px solid rgba(212,175,106,.42);
  border-radius:26px;
  box-shadow:0 30px 80px rgba(0,0,0,.75),0 0 45px rgba(184,138,74,.07),inset 0 1px 0 rgba(255,255,255,.04);
}
.login-top-line{
  position:absolute;top:0;left:12%;right:12%;height:2px;
  background:linear-gradient(90deg,transparent,var(--goldBright),var(--silverBright),var(--goldBright),transparent);
}
.logo-circle{
  width:112px;height:112px;margin:0 auto 22px;
  display:flex;justify-content:center;align-items:center;
  border-radius:50%;
  background:radial-gradient(circle at 32% 25%,#F7F7F7 0%,#D8D8D8 17%,#888 35%,#353535 57%,#111 78%,#050505 100%);
  border:3px solid #0A0A0A;
  box-shadow:0 0 0 1px var(--goldBright),0 0 0 4px rgba(212,175,106,.10),0 14px 40px rgba(0,0,0,.75);
  animation:logoBreath 3.8s ease-in-out infinite;
}
.logo-text{color:#111;font-size:30px;font-weight:900;letter-spacing:3px}
.login-title{text-align:center;color:var(--silverBright);font-size:25px;font-weight:900;margin-bottom:7px}
.login-subtitle{text-align:center;color:var(--goldBright);font-size:14px;margin-bottom:28px}
.login-label{display:block;color:var(--silver);font-size:14px;margin-bottom:8px}
.password-input{
  width:100%;height:52px;padding:0 16px;border-radius:14px;outline:none;
  color:#fff;background:#050505;border:1px solid rgba(201,201,201,.25);
}
.password-input:focus{border-color:var(--goldBright);box-shadow:0 0 0 3px rgba(212,175,106,.08)}
.login-button{
  width:100%;height:52px;margin-top:18px;border:0;border-radius:14px;
  color:#100B05;font-size:15px;font-weight:900;
  background:linear-gradient(135deg,#8E6736,#D4AF6A,#B88A4A);
  transition:.25s;
}
.login-button:hover{transform:translateY(-2px)}
.login-error{min-height:22px;margin-top:13px;text-align:center;color:var(--red);font-size:13px}
.login-footer{text-align:center;color:#777;font-size:11px;margin-top:22px}

/* APP */
#appPage{
  min-height:100vh;
  background:radial-gradient(circle at 50% -20%,rgba(184,138,74,.08),transparent 35%),linear-gradient(180deg,#050505,#080808 45%,#030303);
}
.app-header{
  position:sticky;top:0;z-index:50;
  backdrop-filter:blur(16px);
  background:rgba(7,7,7,.94);
  border-bottom:1px solid rgba(212,175,106,.18);
}
.header-inner{min-height:82px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:13px}
.brand-logo{
  width:48px;height:48px;display:flex;justify-content:center;align-items:center;
  border-radius:50%;color:#111;font-size:13px;font-weight:900;
  background:radial-gradient(circle at 30% 25%,#F3F3F3,#BEBEBE 35%,#444 70%,#111);
  border:2px solid var(--goldBright);
}
.brand-text strong{display:block;color:var(--silverBright);font-size:17px;letter-spacing:1px}
.brand-text span{display:block;color:var(--goldBright);font-size:12px;margin-top:4px}
.header-status{text-align:left;font-size:12px;color:var(--muted)}
.status-live{display:inline-flex;align-items:center;gap:7px;color:var(--green);font-weight:700}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 7px var(--green);animation:statusBlink 2s infinite}
.status-offline{color:var(--red)}
.status-offline .status-dot{background:var(--red);box-shadow:0 0 7px var(--red)}

.nav-bar{padding:15px 0}
.nav-inner{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none}
.nav-inner::-webkit-scrollbar{display:none}
.nav-button{
  flex:0 0 auto;padding:11px 18px;border-radius:12px;color:#AAA;background:#0C0C0C;
  border:1px solid rgba(201,201,201,.14);transition:.25s
}
.nav-button:hover{color:#fff;border-color:rgba(212,175,106,.35)}
.nav-button.active{
  color:#120C05;font-weight:900;
  background:linear-gradient(135deg,#9D733D,#D4AF6A);
  border-color:var(--goldBright)
}

.section{padding:25px 0 35px}
.section-title{color:var(--silverBright);font-size:22px;font-weight:900;margin-bottom:6px}
.section-description{color:var(--muted);font-size:13px;margin-bottom:20px}

/* MARKET */
.market-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.market-area{
  min-height:154px;padding:1px;border-radius:18px;background:#0B0B0B;overflow:hidden;
  border:1px solid var(--green);animation:marketGreenPulse 3.4s ease-in-out infinite
}
.market-area.error{border-color:var(--red);animation:marketRedPulse 2.8s infinite}
.market-card{
  width:100%;height:100%;min-height:152px;padding:20px 15px;
  display:flex;flex-direction:column;justify-content:space-between;text-align:center;
  background:linear-gradient(145deg,#151515,#090909);border-radius:17px
}
.market-title{color:var(--silver);font-size:14px;font-weight:800}
.market-value{color:var(--goldBright);font-size:24px;font-weight:900;direction:ltr;text-shadow:0 0 12px rgba(212,175,106,.1)}
.market-unit{color:var(--muted);font-size:11px}
.market-update{color:#6F6A64;font-size:10px}
.price-change{font-size:10px;min-height:14px}
.price-up{color:var(--green)}
.price-down{color:var(--red)}
.price-neutral{color:#777}

/* PANELS */
.panel{
  padding:22px;margin-top:22px;
  background:linear-gradient(145deg,#111,#080808);
  border:1px solid rgba(201,201,201,.13);border-radius:20px;
  box-shadow:0 18px 45px rgba(0,0,0,.42)
}
.panel-title{color:var(--silverBright);font-size:18px;font-weight:900;margin-bottom:18px}
.sub-title{color:var(--goldBright);font-size:14px;font-weight:900;margin-bottom:15px}

/* DASHBOARD */
.dashboard-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat-card{
  padding:19px;border-radius:17px;background:#090909;
  border:1px solid rgba(212,175,106,.18)
}
.stat-label{color:var(--muted);font-size:12px;margin-bottom:10px}
.stat-value{color:var(--goldBright);font-size:21px;font-weight:900}
.stat-small{color:#777;font-size:10px;margin-top:7px}

/* DASHBOARD PERIOD */
.period-summary{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
  margin-top:20px;
}
.period-button{
  min-height:58px;
  border-radius:14px;
  border:1px solid rgba(212,175,106,.18);
  background:#090909;
  color:#AAA;
  transition:.25s;
}
.period-button:hover{
  color:#fff;
  border-color:rgba(212,175,106,.45);
  transform:translateY(-1px);
}
.period-button.active{
  color:#120C05;
  font-weight:900;
  background:linear-gradient(135deg,#9D733D,#D4AF6A);
}
.period-label{display:block;font-size:13px;font-weight:900}
.period-date{display:block;font-size:9px;margin-top:5px;opacity:.75}

.summary-result{
  margin-top:18px;
  padding:18px;
  border-radius:16px;
  background:linear-gradient(145deg,#12100E,#070707);
  border:1px solid rgba(212,175,106,.22);
}
.summary-result-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:14px;
}
.summary-result-title{color:var(--goldBright);font-size:15px;font-weight:900}
.summary-result-date{color:#777;font-size:10px}
.summary-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
}
.summary-item{
  padding:14px;
  border-radius:12px;
  background:#050505;
  border:1px solid rgba(255,255,255,.06);
}
.summary-item-label{color:#777;font-size:10px}
.summary-item-value{color:#eee;font-size:16px;font-weight:900;margin-top:7px}

/* TABLE */
.table-wrap{overflow-x:auto;border-radius:14px}
.data-table{width:100%;border-collapse:collapse;min-width:700px}
.data-table th,.data-table td{padding:13px 10px;text-align:center;border-bottom:1px solid rgba(255,255,255,.07);font-size:12px}
.data-table th{color:var(--goldBright);background:#090909}
.data-table td{color:#D8D3CA}
.data-table tr:hover td{background:rgba(212,175,106,.035)}

/* FORM */
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.form-group label{display:block;color:var(--silver);font-size:13px;margin-bottom:8px}
.form-control{
  width:100%;height:48px;padding:0 14px;color:#fff;background:#050505;
  border:1px solid rgba(201,201,201,.2);border-radius:12px;outline:none
}
.form-control:focus{border-color:var(--goldBright);box-shadow:0 0 0 3px rgba(212,175,106,.07)}
.form-help{color:#666;font-size:10px;margin-top:6px}
.full{grid-column:1/-1}

/* FILE */
.file-input{
  width:100%;
  padding:13px 14px;
  color:#aaa;
  background:#050505;
  border:1px solid rgba(201,201,201,.2);
  border-radius:12px;
  outline:none;
}
.file-input::file-selector-button{
  border:1px solid rgba(212,175,106,.3);
  background:#151515;
  color:var(--goldBright);
}
