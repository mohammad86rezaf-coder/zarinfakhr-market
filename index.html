<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SILVER ZARIN FAKHR | تابلو قیمت نقره</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      background:
        radial-gradient(
          circle at top,
          #fffdf9 0%,
          #f7e9d9 45%,
          #ead8c7 100%
        );
      color: #2e0803;
    }

    .container {
      width: min(1100px, 94%);
      margin: auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 30px 0;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 45px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: #fffaf3;
      border: 1px solid #c39871;
      box-shadow: 0 8px 25px rgba(112, 83, 59, .12);
      font-size: 20px;
      font-weight: 900;
      color: #70533b;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(18px, 3vw, 28px);
      letter-spacing: 1px;
    }

    .brand p {
      margin: 5px 0 0;
      color: #70533b;
      font-size: 12px;
      letter-spacing: 1.5px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #70533b;
      font-size: 13px;
      font-weight: 700;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #20a35a;
      box-shadow: 0 0 0 5px rgba(32, 163, 90, .10);
      flex: 0 0 auto;
    }

    .status.error .status-dot {
      background: #c62828;
      box-shadow: 0 0 0 5px rgba(198, 40, 40, .10);
    }

    .hero {
      text-align: center;
      margin-bottom: 30px;
    }

    .hero h2 {
      margin: 0;
      font-size: clamp(26px, 5vw, 48px);
      font-weight: 900;
    }

    .hero p {
      margin: 12px auto 0;
      color: #70533b;
      font-size: 14px;
    }

    .main-price {
      background: rgba(255, 253, 249, .9);
      border: 1px solid #c39871;
      border-radius: 30px;
      padding: 55px 25px;
      text-align: center;
      box-shadow:
        0 20px 55px rgba(112, 83, 59, .14);
    }

    .main-title {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      color: #70533b;
      font-size: clamp(16px, 3vw, 21px);
      font-weight: 900;
    }

    .live-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #20a35a;
      box-shadow:
        0 0 0 5px rgba(32, 163, 90, .10);
      flex: 0 0 auto;
    }

    .main-value {
      margin-top: 25px;
      font-size: clamp(45px, 10vw, 90px);
      line-height: 1.1;
      font-weight: 950;
      color: #2e0803;
      direction: rtl;
      letter-spacing: 1px;
    }

    .main-unit {
      margin-top: 18px;
      color: #a8734b;
      font-size: 15px;
      font-weight: 800;
    }

    .update {
      text-align: center;
      margin: 25px 0;
      color: #70533b;
      font-size: 12px;
    }

    footer {
      text-align: center;
      padding: 20px 10px 5px;
      color: #70533b;
    }

    footer strong {
      display: block;
      color: #2e0803;
      font-size: 15px;
      margin-bottom: 8px;
    }

    .instagram {
      margin-top: 10px;
      direction: ltr;
      font-weight: 900;
      color: #632a16;
    }

    @media (max-width: 600px) {

      .container {
        padding-top: 20px;
      }

      header {
        flex-direction: column;
        align-items: center;
        text-align: center;
        margin-bottom: 35px;
      }

      .main-price {
        padding: 45px 15px;
      }

      .main-value {
        font-size: clamp(38px, 12vw, 65px);
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <header>

      <div class="brand">

        <div class="logo">
          SZF
        </div>

        <div>
          <h1>SILVER ZARIN FAKHR</h1>
          <p>نقره زرین فخر</p>
        </div>

      </div>

      <div class="status" id="status">

        <span class="status-dot"></span>

        <span id="statusText">
          در حال دریافت قیمت...
        </span>

      </div>

    </header>


    <section class="hero">

      <h2>
        تابلو قیمت نقره
      </h2>

      <p>
        قیمت لحظه‌ای یک مثقال نقره ۱۷ عیار
      </p>

    </section>


    <section class="main-price">

      <div class="main-title">

        <span class="live-dot"></span>

        <span>
          قیمت یک مثقال نقره ۱۷ عیار
        </span>

      </div>


      <div
        class="main-value"
        id="mithqal17"
      >
        —
      </div>


      <div class="main-unit">
        تومان / مثقال
      </div>

    </section>


    <div class="update">

      آخرین بروزرسانی:
      <span id="updatedAt">—</span>

    </div>


    <footer>

      <strong>
        SILVER ZARIN FAKHR
      </strong>

      زیبایی در درخشندگی، اصالت در ماندگاری

      <div class="instagram">
        @zarinfakhrSZF
      </div>

    </footer>

  </main>


  <script>

    const API = "/api/prices";

    // وزن یک مثقال
    const MITHQAL_GRAM = 4.608;

    // عیار 17
    const PURITY_17K = 700;


    function formatNumber(value) {

      if (
        value === null ||
        value === undefined ||
        !Number.isFinite(Number(value))
      ) {
        return "—";
      }

      return Number(value).toLocaleString(
        "fa-IR",
        {
          maximumFractionDigits: 0
        }
      );
    }


    // محاسبه قیمت یک مثقال نقره 17 عیار
    //
    // مثال:
    //
    // 505000 ÷ 1000 = 505
    //
    // 505 × 700 = 353500
    //
    // 353500 × 4.608 = 1628928
    //
    function calculateMithqal17(
      silver999
    ) {

      if (
        !Number.isFinite(
          Number(silver999)
        )
      ) {
        return null;
      }

      return (
        Number(silver999) /
        1000 *
        PURITY_17K *
        MITHQAL_GRAM
      );
    }


    function setStatus(
      online,
      message
    ) {

      const status =
        document.getElementById(
          "status"
        );

      const statusText =
        document.getElementById(
          "statusText"
        );

      statusText.textContent =
        message;

      status.classList.toggle(
        "error",
        !online
      );
    }


    function updateUI(data) {

      /*
       * قیمت 999 مستقیماً از API گرفته می‌شود.
       *
       * silver999Toman:
       * قیمت یک گرم نقره 999 به تومان
       */

      const silver999 =
        Number(
          data.silver999Toman
        );


      const mithqal17 =
        calculateMithqal17(
          silver999
        );


      document.getElementById(
        "mithqal17"
      ).textContent =
        formatNumber(
          mithqal17
        );


      if (data.updatedAt) {

        const date =
          new Date(
            data.updatedAt
          );

        document.getElementById(
          "updatedAt"
        ).textContent =
          date.toLocaleTimeString(
            "fa-IR"
          );

      }


      setStatus(
        true,
        "آنلاین • قیمت به‌روز است"
      );

    }


    async function loadPrices() {

      try {

        const response =
          await fetch(
            API +
            "?t=" +
            Date.now(),
            {
              method: "GET",
              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            "API Error"
          );

        }


        const data =
          await response.json();


        if (!data.success) {

          throw new Error(
            data.error ||
            "خطای API"
          );

        }


        updateUI(
          data
        );


      } catch (error) {

        console.error(
          "PRICE LOAD ERROR:",
          error
        );

        setStatus(
          false,
          "خطا در دریافت اطلاعات"
        );

      }

    }


    // بارگذاری اولیه
    loadPrices();


    // بروزرسانی هر 1 ثانیه
    setInterval(
      loadPrices,
      1000
    );

  </script>

</body>
          </html>
